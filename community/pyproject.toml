[project]
name = "community"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-ninja>=1.7.1",
    "psycopg[binary]>=3.3.6",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "aiohttp>=3.14.5",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[project]
name = "community"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-ninja>=1.7.1",
    "psycopg[binary]>=3.3.6",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "aiohttp>=3.14.5",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
]
lint = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
asyncio_mode = "auto"
python_files = [
    "test_*.py",
    "*_tests.py",
    "tests.py",
]
